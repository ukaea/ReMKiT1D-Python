name: pytest

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install -e ".[dev,docs]"
          else
            pip install -e ".[dev]"
          fi

      - name: Install LaTeX (and pandoc for docs) system packages
        run: |
          sudo apt-get update
          APT_PKGS="texlive-latex-recommended texlive-latex-extra latexmk lmodern"
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            APT_PKGS="${APT_PKGS} pandoc"
          fi
          sudo apt-get install -y --no-install-recommends ${APT_PKGS}

      - name: Run pytest with coverage
        run: pytest --cov=RMK_support --cov-report=xml:coverage.xml

      - name: Upload code coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Build Sphinx documentation (warnings as errors)
        if: matrix.python-version == '3.12'
        run: sphinx-build -W -b html docs/source docs/build/html
